name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.3'
          cache: true
      - name: Install dependencies
        run: go mod download
      - name: Check formatting
        run: x=$(gofmt -l .); if [ -n "$x" ]; then echo "Following files are not formatted:"; echo "$x"; exit 1; fi
      - name: Go Vet
        run: go vet ./...
      - name: Build
        run: go build -v -o /dev/null ./main.go
      - name: Run tests
        run: go test -v ./...
